[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is injected in migrations/env.py (MIGRATION_DATABASE_URL, falling back to DATABASE_URL)

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
